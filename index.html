// ===== DATA MANAGEMENT =====
function getDraws(g){try{var s=localStorage.getItem(g+'_dr');if(s)return JSON.parse(s)}catch(e){}return g==='em'?DEF_EM.slice():DEF_LO.slice()}
function saveDraws(g,d){try{localStorage.setItem(g+'_dr',JSON.stringify(d))}catch(e){}}

function mergeDraws(old,fresh){
  var dates={};old.forEach(function(d){dates[d.d]=true});
  var added=fresh.filter(function(d){return!dates[d.d]});
  if(!added.length)return{draws:old,count:0};
  return{draws:added.concat(old).sort(function(a,b){return b.d.localeCompare(a.d)}),count:added.length};
}

function addManual(g,date,nums,sec){
  var draws=getDraws(g);
  var exists=draws.some(function(d){return d.d===date});
  if(exists)return false;
  var dr={d:date,n:nums.sort(function(a,b){return a-b})};
  if(g==='em')dr.s=sec.sort(function(a,b){return a-b});else dr.c=sec[0];
  draws.unshift(dr);
  draws.sort(function(a,b){return b.d.localeCompare(a.d)});
  saveDraws(g,draws);
  return true;
}

// ===== AUTO FETCH =====
async function doFetch(g){
  S.fStatus='Recherche...';render();
  var isEM=g==='em';
  var url=isEM?'https://www.loterieplus.com/euromillions/resultats-tirage.php':'https://www.loterieplus.com/loto/resultats-tirage.php';
  var proxies=['https://api.allorigins.win/raw?url=','https://corsproxy.io/?'];
  for(var p=0;p<proxies.length;p++){
    try{
      var ctrl=new AbortController();
      var t=setTimeout(function(){ctrl.abort()},12000);
      var r=await fetch(proxies[p]+encodeURIComponent(url),{signal:ctrl.signal});
      clearTimeout(t);
      if(!r.ok)continue;
      var html=await r.text();
      var parsed=parseHTML(html,g);
      if(parsed&&parsed.length>=3){
        var old=getDraws(g);
        var m=mergeDraws(old,parsed);
        if(m.count>0){saveDraws(g,m.draws);S.fStatus=m.count+' nouveau(x) tirage(s) !';showToast(m.count+' tirage(s) ajoute(s)');}
        else S.fStatus='Donnees a jour ('+old.length+' tirages)';
        localStorage.setItem('lf_'+g,new Date().toISOString());
        render();return true;
      }
    }catch(e){continue}
  }
  S.fStatus='Auto-update indisponible — ajout manuel ci-dessous';render();return false;
}

function parseHTML(html,g){
  try{
    var draws=[];var isEM=g==='em';
    var doc=new DOMParser().parseFromString(html,'text/html');
    var rows=doc.querySelectorAll('tr');
    for(var i=0;i<rows.length;i++){
      var txt=rows[i].textContent;
      var dm=txt.match(/(\d{2})[\/\-](\d{2})[\/\-](\d{4})/);
      if(!dm)continue;
      var d=dm[3]+'-'+dm[2]+'-'+dm[1];
      // Extract all small numbers from the row
      var cells=rows[i].querySelectorAll('td');
      var allN=[];
      for(var c=0;c<cells.length;c++){
        var cn=cells[c].textContent.match(/\b(\d{1,2})\b/g);
        if(cn)cn.forEach(function(x){var v=parseInt(x);if(v>=1&&v<=50)allN.push(v)});
      }
      if(isEM&&allN.length>=7){
        var mn=allN.slice(0,5).sort(function(a,b){return a-b});
        var sn=allN.slice(5,7).filter(function(n){return n<=12}).sort(function(a,b){return a-b});
        if(mn.length===5&&sn.length===2&&new Set(mn).size===5)draws.push({d:d,n:mn,s:sn});
      }else if(!isEM&&allN.length>=6){
        var mn=allN.slice(0,5).sort(function(a,b){return a-b});
        var ch=allN[5];
        if(mn.length===5&&ch>=1&&ch<=10&&new Set(mn).size===5)draws.push({d:d,n:mn,c:ch});
      }
    }
    return draws.length>0?draws:null;
  }catch(e){return null}
}

// ===== ANALYSIS =====
function analyze(draws,g){
  var isEM=g==='em',mM=isEM?50:49,sM=isEM?12:10,T=draws.length;
  var F={},sF={},L={},sL={},R={},dec={},pairs={},gaps={};
  var i;for(i=1;i<=mM;i++){F[i]=0;L[i]=T;R[i]=0}for(i=1;i<=sM;i++){sF[i]=0;sL[i]=T}
  draws.forEach(function(dr,idx){
    var w=1+(T-idx)/T;
    dr.n.forEach(function(n){F[n]++;R[n]+=w;if(L[n]===T)L[n]=idx;dec[Math.floor((n-1)/10)]=(dec[Math.floor((n-1)/10)]||0)+1});
    var sec=isEM?dr.s:[dr.c];sec.forEach(function(n){sF[n]++;if(sL[n]===T)sL[n]=idx});
    for(var i=0;i<dr.n.length;i++)for(var j=i+1;j<dr.n.length;j++){var k=Math.min(dr.n[i],dr.n[j])+'-'+Math.max(dr.n[i],dr.n[j]);pairs[k]=(pairs[k]||0)+1}
  });
  for(var num=1;num<=mM;num++){var ap=[];draws.forEach(function(dr,idx){if(dr.n.indexOf(num)>=0)ap.push(idx)});
    if(ap.length>1){var gs=[];for(var j=1;j<ap.length;j++)gs.push(ap[j]-ap[j-1]);gaps[num]={avg:gs.reduce(function(a,b){return a+b},0)/gs.length}}}
  var sums=draws.map(function(d){return d.n.reduce(function(a,b){return a+b},0)});
  var avgS=sums.length?sums.reduce(function(a,b){return a+b},0)/sums.length:125;
  var pop={};for(i=1;i<=mM;i++){var p=0;if(i<=31)p+=3;if(i<=12)p+=2;if(i%7===0)p+=2;if(i<=9)p+=1;if([3,7,13,17,21].indexOf(i)>=0)p+=1;if(i%10===0)p+=1;pop[i]=p}
  return{F:F,sF:sF,L:L,sL:sL,R:R,pairs:pairs,gaps:gaps,avgS:avgS,T:T,mM:mM,sM:sM,pop:pop,dec:dec,sums:sums}
}

// ===== UTILS =====
function mx(o){var v=Object.values(o);return v.length?Math.max.apply(null,v)||1:1}
function wP(w,c,m){
  var e=[];for(var k in w){var n=parseInt(k);if(n>=1&&n<=m)e.push([n,Math.max(w[k],0.001)])}
  var tw=e.reduce(function(a,x){return a+x[1]},0)||1;var pk={};var ct=0;var sz=0;
  while(sz<c&&ct<3000){var r=Math.random()*tw;for(var i=0;i<e.length;i++){r-=e[i][1];if(r<=0&&!pk[e[i][0]]){pk[e[i][0]]=true;sz++;break}}ct++}
  while(sz<c){var n=Math.floor(Math.random()*m)+1;if(!pk[n]){pk[n]=true;sz++}}
  return Object.keys(pk).map(Number).sort(function(a,b){return a-b})
}

// ===== OPTIMAL STRATEGY (5 phases) =====
function optimal(g,st,nG){
  var isEM=g==='em',sC=isEM?2:1,mP=mx(st.pop);
  // P1: Composite score
  var CS={};for(var i=1;i<=st.mM;i++){
    var fs=(st.F[i]||0)/st.T,rs=(st.R[i]||0)/(st.T*1.5),os=(st.L[i]||0)/st.T;
    var gs=st.gaps[i]?1/st.gaps[i].avg:0.5;
    var sm=fs*.25+rs*.30+os*.20+gs*.25;
    var ap=1-(st.pop[i]||0)/(mP+1);CS[i]=sm*(.5+ap*1.5)*1000}
  // P2: Consensus (7 algos x 150)
  var V={};for(i=1;i<=st.mM;i++)V[i]=0;
  var tP=Object.entries(st.pairs).sort(function(a,b){return b[1]-a[1]}).slice(0,15);
  for(var it=0;it<150;it++){var ai=it%7;var nums;
    if(ai===0){var w={};for(var j=1;j<=st.mM;j++)w[j]=Math.pow(st.F[j]||.1,2)*(1-(st.pop[j]||0)/mP+.5);nums=wP(w,5,st.mM)}
    else if(ai===1){var w={};for(var j=1;j<=st.mM;j++)w[j]=Math.pow(st.L[j]||1,2)*(1-(st.pop[j]||0)/mP+.5);nums=wP(w,5,st.mM)}
    else if(ai===2){nums=wP(CS,5,st.mM)}
    else if(ai===3){var w={};for(var j=1;j<=st.mM;j++)w[j]=(st.R[j]||.1)*(1-(st.pop[j]||0)/mP+.5);nums=wP(w,5,st.mM)}
    else if(ai===4){var w={};for(var j=1;j<=st.mM;j++){var gg=st.gaps[j]?1/st.gaps[j].avg:.5;w[j]=gg*(st.F[j]||1)*(1-(st.pop[j]||0)/mP+.3)}nums=wP(w,5,st.mM)}
    else if(ai===5){var pk={};if(tP.length){var sp=tP[Math.floor(Math.random()*Math.min(6,tP.length))];sp[0].split('-').map(Number).forEach(function(n){pk[n]=true})}
      var pkS=Object.keys(pk).length;while(pkS<5){var nx=wP(CS,1,st.mM);if(!pk[nx[0]]){pk[nx[0]]=true;pkS++}}nums=Object.keys(pk).map(Number).sort(function(a,b){return a-b}).slice(0,5)}
    else{var best=null,bD=1e9;for(var a=0;a<200;a++){var c=wP(CS,5,st.mM);var s=c.reduce(function(a,b){return a+b},0);var d=Math.abs(s-st.avgS);if(d<bD){best=c;bD=d}}nums=best||wP(CS,5,st.mM)}
    nums.forEach(function(n){V[n]+=(CS[n]||1)})}
  // P3: Monte Carlo (3000)
  var MC={};for(i=1;i<=st.mM;i++)MC[i]=0;
  var tF=Object.values(st.F).reduce(function(a,b){return a+b},0)||1;
  for(var si=0;si<3000;si++){var dr={};var dsz=0;while(dsz<5){var r=Math.random()*tF;for(var n=1;n<=st.mM;n++){r-=(st.F[n]||0);if(r<=0&&!dr[n]){dr[n]=true;dsz++;break}}}Object.keys(dr).forEach(function(n){MC[n]++})}
  // P4: Final ranking
  var FS={},mV=mx(V),mMC=mx(MC),mCS=mx(CS);
  for(i=1;i<=st.mM;i++)FS[i]=(V[i]||0)/mV*.40+(MC[i]||0)/mMC*.25+(CS[i]||0)/mCS*.35;
  var ranked=Object.entries(FS).sort(function(a,b){return b[1]-a[1]});
  var pool=ranked.slice(0,16).map(function(e){return parseInt(e[0])});
  // Secondary
  var sCS={};for(i=1;i<=st.sM;i++){var sf=(st.sF[i]||0)/st.T,sd=(st.sL[i]||0)/st.T;sCS[i]=(sf*.5+sd*.5)*(i<=3?.6:i<=6?.85:1.2)*100}
  // P5: Wheeling
  var grids=[],used={};
  for(var g2=0;g2<nG;g2++){var bG=null,bS=-1;
    for(var at=0;at<400;at++){
      var sh=pool.slice().sort(function(){return Math.random()-.5});
      var co=sh.slice(0,5).sort(function(a,b){return a-b});var key=co.join('-');if(used[key])continue;
      var sum=co.reduce(function(a,b){return a+b},0);
      var sumSc=1-Math.min(Math.abs(sum-st.avgS)/(st.avgS*.3||1),1);
      var ev=co.filter(function(n){return n%2===0}).length;var balSc=1-Math.abs(ev-2.5)/2.5;
      var decs={};co.forEach(function(n){decs[Math.floor((n-1)/10)]=1});var spSc=Object.keys(decs).length/5;
      var cPop=co.reduce(function(a,n){return a+(st.pop[n]||0)},0);var apSc=1-cPop/(5*mP||1);
      var olP=0;grids.forEach(function(pr){var ol=co.filter(function(n){return pr.mn.indexOf(n)>=0}).length;olP+=ol*.12});
      var stSc=co.reduce(function(a,n){return a+(FS[n]||0)},0)/5;
      var sc=sumSc*.20+balSc*.12+spSc*.15+apSc*.20+(1-olP)*.13+stSc*.15;
      if(sc>bS){bS=sc;bG=co}}
    if(bG){used[bG.join('-')]=1;grids.push({mn:bG,sn:wP(sCS,sC,st.sM),score:bS})}}
  grids.sort(function(a,b){return b.score-a.score});
  var cov={};grids.forEach(function(g){g.mn.forEach(function(n){cov[n]=1})});
  var aP=0,aS=0;if(grids.length){grids.forEach(function(g){aP+=g.mn.reduce(function(a,n){return a+(st.pop[n]||0)},0);aS+=g.mn.reduce(function(a,n){return a+n},0)});aP/=grids.length;aS/=grids.length}
  return{grids:grids,pool:pool,ranked:ranked.slice(0,20),FS:FS,st:{cov:Object.keys(cov).length,aP:aP,aS:aS}}
}

function genBasic(algo,g,st){
  var isEM=g==='em',sC=isEM?2:1,sw={};for(var i=1;i<=st.sM;i++)sw[i]=st.sF[i]||1;var mn;
  if(algo==='hot'){var w={};for(i=1;i<=st.mM;i++)w[i]=Math.pow(st.F[i]||.1,2.5);mn=wP(w,5,st.mM)}
  else if(algo==='cold'){var m=mx(st.F);var w={};for(i=1;i<=st.mM;i++)w[i]=Math.pow(m-(st.F[i]||0)+1,2);mn=wP(w,5,st.mM)}
  else if(algo==='overdue'){var w={};for(i=1;i<=st.mM;i++)w[i]=Math.pow(st.L[i]||1,2.5);mn=wP(w,5,st.mM)}
  else{var a=[];for(i=1;i<=st.mM;i++)a.push(i);a.sort(function(){return Math.random()-.5});mn=a.slice(0,5).sort(function(a,b){return a-b})}
  return{mn:mn,sn:wP(sw,sC,st.sM)}
}

    '<span style="width:28px;text-align:right;color:#4b5563;font-family:monospace;font-size:9px;flex-shrink:0">'+(Number.isInteger(val)?val:val.toFixed(1))+'</span></div>';
}

function runOptimal(){
  S.loading=true;render();
  setTimeout(function(){
    var draws=getDraws(S.game);var st=analyze(draws,S.game);
    // Run 3 times, keep best
    var best=null,bAvg=0;
    for(var r=0;r<3;r++){
      var res=optimal(S.game,st,S.gridCount);
      var avg=res.grids.reduce(function(a,g){return a+g.score},0)/(res.grids.length||1);
      if(avg>bAvg){bAvg=avg;best=res}}
    S.result=best;S.loading=false;
    // Save to history
    if(best){best.grids.forEach(function(g){S.hist.unshift({mn:g.mn,sn:g.sn,score:g.score,algo:'optimal',game:S.game})});
      S.hist=S.hist.slice(0,200);saveHist(S.hist)}
    render();
  },100);
}

function runSimple(){
  var draws=getDraws(S.game);var st=analyze(draws,S.game);
  S.sResult=genBasic(S.sAlgo,S.game,st);
  S.hist.unshift({mn:S.sResult.mn,sn:S.sResult.sn,algo:S.sAlgo,game:S.game});
  S.hist=S.hist.slice(0,200);saveHist(S.hist);render()
}

function doManualAdd(){
  var date=document.getElementById('mDate').value;
  var numsStr=document.getElementById('mNums').value.trim();
  var secStr=document.getElementById('mSec').value.trim();
  if(!date||!numsStr||!secStr){toast('Remplir tous les champs');return}
  var nums=numsStr.split(/[\s,;-]+/).map(Number).filter(function(n){return n>=1&&n<=(S.game==='em'?50:49)});
  var sec=secStr.split(/[\s,;-]+/).map(Number).filter(function(n){return n>=1&&n<=(S.game==='em'?12:10)});
  var isEM=S.game==='em';
  if(nums.length!==5){toast('Il faut exactement 5 numeros');return}
  if(isEM&&sec.length!==2){toast('Il faut 2 etoiles');return}
  if(!isEM&&sec.length!==1){toast('Il faut 1 N Chance');return}
  if(new Set(nums).size!==5){toast('Numeros en double');return}
  var ok=addManual(S.game,date,nums,sec);
  if(ok){toast('Tirage ajoute !');render()}
  else toast('Ce tirage existe deja');
}

// ===== INIT =====
function init(){
  S.hist=getHist();
  // Register service worker
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(function(e){console.log('SW:',e)})
  }
  render();
  // Auto-fetch on load
  setTimeout(function(){
    var lf=localStorage.getItem('lf_'+S.game);
    var now=Date.now();
    var last=lf?new Date(lf).getTime():0;
    // Fetch if last fetch was more than 6 hours ago
    if(now-last>6*60*60*1000){doFetch(S.game)}
  },2000);
}
init();
</script>
